<div class="section" id="experience">
  <div class="container experience-shell">
    <div class="h4 text-center mb-4 title">Work Experience</div>
    <div class="timeline-centered">
      <article
        class="timeline-entry"
        *ngFor="let item of experiences; let i = index"
        [class.timeline-entry-left]="i % 2 === 0"
        [class.timeline-entry-right]="i % 2 !== 0"
        appScrollReveal="up">
        <div class="timeline-entry-inner">
          <div class="timeline-icon">
            <i class="fa fa-briefcase" aria-hidden="true"></i>
          </div>
          <div class="timeline-label">
            <span class="timeline-period">{{ item.period }}</span>
            <h2>{{ item.role }}</h2>
            <h4>{{ item.company }}</h4>
            <p>{{ item.summary }}</p>
            <ul>
              <li *ngFor="let responsibility of item.responsibilities">{{ responsibility }}</li>
            </ul>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
