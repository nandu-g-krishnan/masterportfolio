<div class="section" id="about">
  <div class="container">
    <div class="card about-card">
      <div class="about-layout">
        <div class="about-content" appScrollReveal="left">
          <section class="about-block">
            <div class="h4 mt-0 title">About</div>
            <p>Hi, I'm <strong>{{ profile.name }}</strong>.</p>
            <p>{{ profile.aboutSummary }}</p>
          </section>

          <section class="about-block">
            <div class="h4 mt-0 title">Career Objective</div>
            <p>{{ profile.careerObjective }}</p>
          </section>

          <section class="about-block">
            <div class="h4 mt-0 title">Basic Information</div>
            <div class="basic-info-list">
              <div class="info-row">
                <strong class="info-key">Date of Birth</strong>
                <span class="info-value">{{ profile.dateOfBirth }}</span>
              </div>
              <div class="info-row">
                <strong class="info-key">Email</strong>
                <span class="info-value">{{ profile.email }}</span>
              </div>
              <div class="info-row">
                <strong class="info-key">Phone</strong>
                <span class="info-value">{{ profile.phone }}</span>
              </div>
              <div class="info-row">
                <strong class="info-key">Address</strong>
                <span class="info-value">{{ profile.address }}</span>
              </div>
              <div class="info-row">
                <strong class="info-key">Languages</strong>
                <span class="info-value">{{ profile.languages.join(', ') }}</span>
              </div>
            </div>
          </section>
        </div>

        <div class="about-media" appScrollReveal="right">
          <img class="about-pro-image" src="../../../assets/images/profullimage.jpeg" alt="Professional profile" />
        </div>
      </div>
    </div>
  </div>
</div>
