<div class="section contact-section" id="contact">
  <div class="container cc-education">
    <div class="h4 text-center mb-4 title">Contact</div>
    <div class="card contact-card" appScrollReveal="up">
      <div class="card-body">
        <div class="contact-grid">
          <div class="contact-details" appScrollReveal="left">
            <p class="contact-intro">
              Interested in working together on modern web platforms and high-quality enterprise products? Let's connect.
            </p>
            <div class="contact-row mt-3">
              <span class="contact-label">Email</span>
              <span class="contact-value">{{ profile.email }}</span>
            </div>
            <div class="contact-row">
              <span class="contact-label">Phone</span>
              <span class="contact-value">{{ profile.phone }}</span>
            </div>
            <div class="contact-row">
              <span class="contact-label">Address</span>
              <span class="contact-value">{{ profile.address }}</span>
            </div>
            <div class="contact-connect-title">Professional Profiles</div>
            <div class="contact-channel-grid">
              <a
                class="contact-channel"
                *ngFor="let channel of contactChannels"
                [href]="channel.url"
                target="_blank"
                rel="noopener noreferrer">
                <span class="channel-icon"><i class="fa" [ngClass]="channel.icon"></i></span>
                <span class="channel-meta">
                  <span class="channel-name">{{ channel.label }}</span>
                  <span class="channel-note">{{ channel.subtitle }}</span>
                </span>
                <span class="channel-action">Open</span>
              </a>
            </div>
          </div>

          <form
            class="contact-form"
            appScrollReveal="right"
            (submit)="openEmailDraft(nameInput.value, emailInput.value, subjectInput.value, messageInput.value); $event.preventDefault()">
            <div class="form-heading">Send a Direct Message</div>
            <div class="form-field">
              <label for="contact-name">Name</label>
              <input #nameInput id="contact-name" type="text" placeholder="Your name" />
            </div>
            <div class="form-field">
              <label for="contact-email">Email</label>
              <input #emailInput id="contact-email" type="email" placeholder="your@email.com" />
            </div>
            <div class="form-field">
              <label for="contact-subject">Subject</label>
              <input #subjectInput id="contact-subject" type="text" placeholder="Project or role discussion" />
            </div>
            <div class="form-field">
              <label for="contact-message">Message</label>
              <textarea #messageInput id="contact-message" rows="4" placeholder="Share a quick overview..."></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Open Email Draft</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
