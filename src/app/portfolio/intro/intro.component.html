<div class="profile-page">
  <div class="wrapper">
    <div class="page-header page-header-small">
      <div class="container">
        <div class="content-center">
          <div class="hero-content-shell">
            <div class="cc-profile-image">
              <a href="#">
                <img src="assets/images/nandugkrishnan.jpg" alt="Profile image" />
              </a>
            </div>
            <div class="h2 title hero-name">{{ profile.name }}</div>
            <p class="category text-white">{{ profile.title }}</p>
            <div class="hero-actions">
              <a class="btn btn-primary" [href]="profile.cvUrl" target="_blank">
                Download CV
              </a>
              <a class="btn btn-outline-light smooth-scroll" href="#experience-projects">View Experience</a>
            </div>
          </div>
        </div>
      </div>
      <div class="hero-social-bridge">
        <div class="container">
          <div class="primary-social-wrap" appScrollReveal="up">
            <a class="btn btn-default btn-round btn-lg btn-icon"
               *ngFor="let social of profile.socialLinks"
               [href]="social.url"
               target="_blank"
               rel="tooltip"
               [title]="'Follow me on ' + social.platform">
              <i class="fa" [ngClass]="social.icon"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
